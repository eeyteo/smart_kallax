<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omnisensor - Live Readings</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <div class="layout">
    <div class="intro">
      <h1 id="page-title">Omnisensor - Live Readings</h1>
      <a href="/" class="btn">Back to guide</a>
    </div>

    <div class="container">
      <h3 class="heading">Sensors</h3>
      <div id="sensors" class="loading">Loading readings...</div>
    </div>

    <div class="container">
      <h3 class="heading">Inputs &amp; LEDs</h3>
      <div id="io" class="loading">Loading...</div>
    </div>

    <div class="container">
      <p id="status">-</p>
    </div>
  </div>

  <script>
    const REFRESH_MS = 5000;

    function yesNo(v) { return v ? "Yes" : "No"; }
    function onOff(v) { return v ? "ON" : "OFF"; }
    function num(value, unit) {
      return (typeof value === "number") ? value.toFixed(1) + " " + unit : "\u2014";
    }

    function render(data) {
      document.getElementById("page-title").textContent =
        (data.nodeDisplayName || data.nodeName || "Omnisensor") + " - Live Readings";

      let s = "<ul>";
      s += "<li><strong>Temperature:</strong> " + num(data.temperature, "\u00B0C") + "</li>";
      s += "<li><strong>Humidity:</strong> " + num(data.humidity, "%") + "</li>";
      s += "<li><strong>Light level:</strong> " +
           ((typeof data.lightLevel === "number") ? data.lightLevel + " lux" : "\u2014") + "</li>";
      s += "<li><strong>Presence:</strong> " + yesNo(data.presence) + "</li>";
      s += "<li><strong>Distance:</strong> " +
           ((typeof data.distance === "number") ? data.distance + " cm" : "\u2014") + "</li>";
      s += "<li><strong>Wi-Fi RSSI:</strong> " +
           ((typeof data.rssi === "number") ? data.rssi + " dBm" : "\u2014") + "</li>";
      s += "<li><strong>Firmware:</strong> " +
           ((data.fwVersion !== undefined) ? data.fwVersion : "\u2014") + "</li>";
      s += "</ul>";
      document.getElementById("sensors").innerHTML = s;
      document.getElementById("sensors").classList.remove("loading");

      let io = "<ul>";
      (data.inputs || []).forEach(function (i) {
        io += "<li><strong>" + i.name + ":</strong> " + onOff(i.state) + "</li>";
      });
      (data.leds || []).forEach(function (l) {
        io += "<li><strong>" + l.name + ":</strong> " + onOff(l.state) + "</li>";
      });
      io += "</ul>";
      document.getElementById("io").innerHTML = io;
      document.getElementById("io").classList.remove("loading");

      document.getElementById("status").textContent =
        "Updated " + new Date().toLocaleTimeString();
    }

    function loadReadings() {
      fetch("/getReadings")
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(render)
        .catch(function (err) {
          document.getElementById("sensors").innerHTML =
            "<p>Error loading readings: " + err.message + "</p>";
          document.getElementById("sensors").classList.remove("loading");
        });
    }

    loadReadings();
    setInterval(loadReadings, REFRESH_MS);
  </script>
</body>
</html>
